<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Love Calculator</title>
 
<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
 
  const firebaseConfig = {
    apiKey:            "AIzaSyDLMzrjs9_Ba0UifOK2uCKtqEVdDTbMGIE",
    authDomain:        "love-calculator-b6886.firebaseapp.com",
    projectId:         "love-calculator-b6886",
    storageBucket:     "love-calculator-b6886.firebasestorage.app",
    messagingSenderId: "599936853483",
    appId:             "1:599936853483:web:c4bc87bb437aacb7b2e5ae",
    measurementId:     "G-4QV0LR9GS5"
  };
 
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
 
  // Expose to global scope so normal <script> below can use them
  window._db         = db;
  window._collection = collection;
  window._addDoc     = addDoc;
  window._getDocs    = getDocs;
  window._deleteDoc  = deleteDoc;
  window._doc        = doc;
  window._query      = query;
  window._orderBy    = orderBy;
  window._dbReady    = true;
  console.log("✅ Firebase connected!");
</script>
 
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
 
  :root {
    --rose:  #E8305A;
    --deep:  #1A0A10;
    --card:  #2A1020;
    --soft:  #F5E6EC;
    --gold:  #F7C948;
    --muted: #9A6070;
  }
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--deep);
    color: var(--soft);
    min-height: 100vh;
    overflow-x: hidden;
  }
 
  /* Floating hearts */
  .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .heart-float {
    position: absolute; opacity: 0.08;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0.08; }
    100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
  }
 
  .page { position: relative; z-index: 1; }
 
  header { text-align: center; padding: 3rem 1rem 1.5rem; }
  header .eyebrow {
    font-size: 0.75rem; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 4rem);
    color: var(--soft); line-height: 1.1;
  }
  header h1 span { color: var(--rose); font-style: italic; }
 
  .status-bar {
    text-align: center;
    font-size: 0.78rem;
    padding: 0.4rem 1rem;
    margin-bottom: 0.5rem;
  }
  .status-bar.connected { color: #4caf50; }
  .status-bar.connecting { color: var(--gold); }
 
  /* Card */
  .card {
    background: var(--card);
    border: 1px solid rgba(232,48,90,0.18);
    border-radius: 1.5rem;
    max-width: 460px;
    margin: 1.5rem auto;
    padding: 2rem 2rem 2.5rem;
    box-shadow: 0 8px 48px rgba(232,48,90,0.12);
  }
 
  label {
    display: block; font-size: 0.78rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 0.4rem; margin-top: 1.2rem;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: rgba(255,179,198,0.06);
    border: 1px solid rgba(232,48,90,0.25);
    border-radius: 0.75rem;
    padding: 0.85rem 1rem;
    font-size: 1.05rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--soft); outline: none;
    transition: border-color 0.2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--rose); }
 
  .heart-divider {
    text-align: center; margin: 1.4rem 0 0; font-size: 1.5rem;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
 
  .btn {
    display: block; width: 100%; margin-top: 1.8rem; padding: 1rem;
    background: linear-gradient(135deg, var(--rose), #b8003a);
    color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 1rem; font-weight: 500; border: none;
    border-radius: 0.85rem; cursor: pointer;
    letter-spacing: 0.04em; transition: opacity 0.2s, transform 0.15s;
  }
  .btn:hover  { opacity: 0.88; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
 
  /* Result */
  #result { display: none; text-align: center; margin-top: 2rem; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
 
  .percentage-ring { position: relative; width: 140px; height: 140px; margin: 0 auto 1rem; }
  .percentage-ring svg { transform: rotate(-90deg); }
  .ring-bg  { fill: none; stroke: rgba(255,179,198,0.12); stroke-width: 10; }
  .ring-val {
    fill: none; stroke: var(--rose); stroke-width: 10;
    stroke-linecap: round; stroke-dasharray: 352; stroke-dashoffset: 352;
    transition: stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
  }
  .ring-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-text .pct { font-family: 'Playfair Display', serif; font-size: 2.4rem; color: var(--rose); line-height: 1; }
  .ring-text .pct-label { font-size: 0.75rem; color: var(--muted); }
 
  #result .verdict { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--soft); margin-bottom: 0.5rem; }
  #result .message { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
  #result .saved-note { margin-top: 1rem; font-size: 0.8rem; }
 
  .try-again {
    background: transparent; border: 1px solid rgba(232,48,90,0.35);
    color: var(--rose); margin-top: 1.2rem; width: auto;
    padding: 0.6rem 1.5rem; display: inline-block;
    border-radius: 2rem; font-size: 0.85rem; cursor: pointer;
    transition: background 0.2s;
  }
  .try-again:hover { background: rgba(232,48,90,0.1); }
 
  /* Admin toggle */
  .admin-toggle-area { text-align: center; padding: 1.5rem 0 0; }
  .admin-link {
    font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em;
    cursor: pointer; background: none; border: none;
    text-decoration: underline dotted; text-underline-offset: 3px;
  }
  .admin-link:hover { color: var(--rose); }
 
  .admin-pwd {
    margin-top: 0.6rem; display: none; gap: 0.5rem;
    justify-content: center; align-items: center; flex-wrap: wrap;
  }
  .admin-pwd input {
    background: rgba(255,179,198,0.06);
    border: 1px solid rgba(232,48,90,0.25);
    border-radius: 0.5rem; padding: 0.4rem 0.8rem;
    font-size: 0.85rem; color: var(--soft); outline: none; width: 160px;
  }
  .admin-pwd button {
    padding: 0.4rem 1rem; background: var(--rose); color: #fff;
    border: none; border-radius: 0.5rem; font-size: 0.85rem; cursor: pointer;
  }
  .pwd-error { font-size: 0.75rem; color: var(--rose); margin-top: 0.3rem; }
 
  /* Admin panel */
  #admin-section {
    display: none; max-width: 560px; margin: 1rem auto 4rem;
    padding: 0 1rem; animation: fadeIn 0.4s ease;
  }
  #admin-section h2 {
    font-family: 'Playfair Display', serif; font-size: 1.6rem;
    color: var(--soft); margin-bottom: 1.2rem;
  }
  .admin-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
 
  .admin-entry {
    background: var(--card); border: 1px solid rgba(232,48,90,0.15);
    border-radius: 1rem; padding: 1rem 1.2rem; margin-bottom: 0.8rem;
    display: flex; align-items: center; gap: 1rem;
    animation: fadeIn 0.3s ease;
  }
  .admin-entry .names { flex: 1; font-size: 0.95rem; color: var(--soft); }
  .admin-entry .names .ts { color: var(--muted); font-size: 0.78rem; display: block; margin-top: 0.2rem; }
  .admin-entry .pct-badge {
    background: var(--rose); color: #fff; border-radius: 2rem;
    padding: 0.3rem 0.8rem; font-weight: 500; font-size: 0.9rem; white-space: nowrap;
  }
 
  .empty-admin { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 2rem; }
 
  .admin-actions { display: flex; gap: 0.8rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .btn-sm {
    background: transparent; border: 1px solid rgba(232,48,90,0.3);
    color: var(--rose); padding: 0.45rem 1.1rem; border-radius: 2rem;
    font-size: 0.82rem; cursor: pointer; transition: background 0.2s;
  }
  .btn-sm:hover { background: rgba(232,48,90,0.1); }
 
  /* Dots */
  .dots span { animation: blink 1.2s infinite; display: inline-block; }
  .dots span:nth-child(2){ animation-delay:.2s }
  .dots span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
 
  footer { text-align: center; padding: 1.5rem 1rem; font-size: 0.72rem; color: var(--muted); }
 
  @media (max-width: 500px) {
    .card { margin: 1rem; padding: 1.5rem 1.2rem 2rem; }
    #admin-section { padding: 0 0.8rem; }
  }
</style>
</head>
<body>
 
<div class="hearts-bg" id="heartsBg"></div>
 
<div class="page">
  <header>
    <p class="eyebrow">Powered by Firebase</p>
    <h1>Love<br><span>Calculator</span></h1>
  </header>
 
  <p class="status-bar connecting" id="statusBar">⏳ Connecting to Firebase...</p>
 
  <div class="card">
    <label for="yourName">Your Name</label>
    <input type="text" id="yourName" placeholder="e.g. Arjun" maxlength="40">
 
    <div class="heart-divider">💘</div>
 
    <label for="crushName">Your Crush's Name</label>
    <input type="text" id="crushName" placeholder="e.g. Priya" maxlength="40">
 
    <button class="btn" id="calcBtn" onclick="calculate()">Calculate Love ❤️</button>
 
    <div id="result">
      <div class="percentage-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle class="ring-bg" cx="70" cy="70" r="56"/>
          <circle class="ring-val" id="ringCircle" cx="70" cy="70" r="56"/>
        </svg>
        <div class="ring-text">
          <span class="pct" id="pctNum">0%</span>
          <span class="pct-label">love</span>
        </div>
      </div>
      <p class="verdict" id="verdict"></p>
      <p class="message" id="loveMsg"></p>
      <p class="saved-note" id="savedNote"></p>
      <button class="try-again" onclick="reset()">Try again →</button>
    </div>
  </div>
 
  <!-- Admin Login -->
  <div class="admin-toggle-area">
    <button class="admin-link" onclick="toggleAdminLogin()">Admin panel</button>
    <div class="admin-pwd" id="adminPwd">
      <input type="password" id="pwdInput" placeholder="Password"
             onkeydown="if(event.key==='Enter') adminLogin()">
      <button onclick="adminLogin()">Enter</button>
    </div>
    <div class="pwd-error" id="pwdError" style="display:none">Wrong password ❌</div>
  </div>
 
  <!-- Admin Panel -->
  <div id="admin-section">
    <h2>💌 Admin — All Submissions</h2>
    <p class="admin-meta" id="adminMeta">Loading from Firebase...</p>
    <div id="adminList"></div>
    <div class="admin-actions">
      <button class="btn-sm" onclick="loadAdmin()">↻ Refresh</button>
      <button class="btn-sm" onclick="clearAllAdmin()">🗑 Clear all</button>
    </div>
  </div>
 
  <footer>Love Calculator · Firebase Real-time Database · Free Forever 💕</footer>
</div>
 
<script>
  // ── Config ──────────────────────────────────────────────
  const ADMIN_PASS = 'admin123'; // Change this to your own password!
 
  // ── Status bar ──────────────────────────────────────────
  function waitForFirebase() {
    const bar = document.getElementById('statusBar');
    let tries = 0;
    const check = setInterval(() => {
      tries++;
      if (window._dbReady) {
        clearInterval(check);
        bar.textContent = '🔥 Firebase connected — data syncs across all devices!';
        bar.className = 'status-bar connected';
        setTimeout(() => bar.style.display = 'none', 3000);
      } else if (tries > 40) {
        clearInterval(check);
        bar.textContent = '❌ Firebase not connected. Check your internet.';
        bar.style.color = 'var(--rose)';
      }
    }, 250);
  }
  waitForFirebase();
 
  // ── Floating hearts ──────────────────────────────────────
  const bg = document.getElementById('heartsBg');
  ['💗','💓','💖','💝','🌸','✨','💞'].forEach(emoji => {
    for (let j = 0; j < 3; j++) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = emoji;
      h.style.left              = Math.random() * 100 + 'vw';
      h.style.fontSize          = (0.8 + Math.random() * 1.4) + 'rem';
      h.style.animationDuration = (10 + Math.random() * 16) + 's';
      h.style.animationDelay    = (Math.random() * 12) + 's';
      bg.appendChild(h);
    }
  });
 
  // ── Love Algorithm ───────────────────────────────────────
  function lovePct(a, b) {
    const s = (a + b).toLowerCase().replace(/\s/g, '');
    let hash = 5381;
    for (let i = 0; i < s.length; i++) {
      hash = ((hash << 5) + hash) ^ s.charCodeAt(i);
    }
    return Math.abs(hash % 66) + 25; // always 25–90
  }
 
  const VERDICTS = [
    [90, '💍 Soulmates!',          'The stars wrote your names together. This love was truly meant to be.'],
    [75, '🔥 Perfect Match',       "A deep spark connects you both. Don't let this one slip away!"],
    [60, '💞 Great Chemistry',     "There's real potential here — with a little effort, magic awaits."],
    [45, '🌸 Good Friends',        'A warm bond exists. Love might bloom with more time together.'],
    [30, "🤷 It's Complicated",    'Opposites sometimes attract — but you\'ll need some work!'],
    [0,  '😬 Tough Road Ahead',    'Love is unpredictable. Never say never, but manage expectations!'],
  ];
  function getVerdict(pct) {
    for (const [min, v, m] of VERDICTS) if (pct >= min) return [v, m];
  }
 
  // ── Firebase: Save ───────────────────────────────────────
  async function saveToFirebase(data) {
    if (!window._dbReady) throw new Error('Firebase not ready');
    const ref = window._collection(window._db, 'submissions');
    await window._addDoc(ref, data);
  }
 
  // ── Firebase: Load ───────────────────────────────────────
  async function loadFromFirebase() {
    if (!window._dbReady) return [];
    const ref  = window._collection(window._db, 'submissions');
    const q    = window._query(ref, window._orderBy('timestamp', 'desc'));
    const snap = await window._getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
 
  // ── Firebase: Delete all ─────────────────────────────────
  async function deleteAllFromFirebase() {
    const list = await loadFromFirebase();
    for (const e of list) {
      await window._deleteDoc(window._doc(window._db, 'submissions', e.id));
    }
  }
 
  // ── Calculate ────────────────────────────────────────────
  async function calculate() {
    const yourName  = document.getElementById('yourName').value.trim();
    const crushName = document.getElementById('crushName').value.trim();
    if (!yourName || !crushName) {
      alert('Please enter both names 💕');
      return;
    }
 
    const btn = document.getElementById('calcBtn');
    btn.disabled = true;
    btn.innerHTML = 'Calculating <span class="dots"><span>.</span><span>.</span><span>.</span></span>';
 
    await new Promise(r => setTimeout(r, 1400));
 
    const pct          = lovePct(yourName, crushName);
    const [verdict, msg] = getVerdict(pct);
 
    // Animate ring
    const circumference = 2 * Math.PI * 56;
    document.getElementById('ringCircle').style.strokeDashoffset =
      circumference - (pct / 100) * circumference;
 
    document.getElementById('pctNum').textContent  = pct + '%';
    document.getElementById('verdict').textContent = verdict;
    document.getElementById('loveMsg').textContent = msg;
    document.getElementById('result').style.display = 'block';
    btn.style.display = 'none';
 
    // Save to Firebase
    const note = document.getElementById('savedNote');
    note.textContent = '⏳ Saving to Firebase...';
    note.style.color = 'var(--gold)';
 
    try {
      await saveToFirebase({
        yourName,
        crushName,
        pct,
        timestamp: new Date().toISOString()
      });
      note.textContent = '✅ Saved! Visible in admin on ALL devices worldwide 🌍';
      note.style.color = '#4caf50';
    } catch (e) {
      console.error(e);
      note.textContent = '⚠️ Could not save. Check Firestore rules in Firebase console.';
      note.style.color = 'var(--rose)';
    }
  }
 
  // ── Reset ────────────────────────────────────────────────
  function reset() {
    document.getElementById('yourName').value   = '';
    document.getElementById('crushName').value  = '';
    document.getElementById('result').style.display = 'none';
    document.getElementById('ringCircle').style.strokeDashoffset = '352';
    const btn = document.getElementById('calcBtn');
    btn.disabled      = false;
    btn.innerHTML     = 'Calculate Love ❤️';
    btn.style.display = 'block';
  }
 
  // ── Admin Login ──────────────────────────────────────────
  function toggleAdminLogin() {
    const el = document.getElementById('adminPwd');
    el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
    document.getElementById('pwdError').style.display = 'none';
  }
 
  function adminLogin() {
    const val = document.getElementById('pwdInput').value;
    if (val === ADMIN_PASS) {
      document.getElementById('adminPwd').style.display  = 'none';
      document.getElementById('pwdError').style.display  = 'none';
      document.getElementById('admin-section').style.display = 'block';
      loadAdmin();
    } else {
      document.getElementById('pwdError').style.display = 'block';
    }
  }
 
  // ── Admin: Load & Render ─────────────────────────────────
  async function loadAdmin() {
    const list = document.getElementById('adminList');
    const meta = document.getElementById('adminMeta');
    list.innerHTML = '<p class="empty-admin">Loading from Firebase<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>';
    meta.textContent = '';
 
    try {
      const submissions = await loadFromFirebase();
 
      if (!submissions.length) {
        list.innerHTML = '<p class="empty-admin">No submissions yet. Share the calculator link!</p>';
        meta.textContent = '0 submissions';
        return;
      }
 
      meta.textContent = `${submissions.length} submission${submissions.length > 1 ? 's' : ''} — sorted newest first`;
 
      list.innerHTML = submissions.map(e => {
        const date = e.timestamp
          ? new Date(e.timestamp).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true })
          : 'Unknown time';
        return `
          <div class="admin-entry">
            <div class="names">
              <strong>${escHtml(e.yourName)}</strong> ❤️ <strong>${escHtml(e.crushName)}</strong>
              <span class="ts">${date}</span>
            </div>
            <div class="pct-badge">${e.pct}%</div>
          </div>`;
      }).join('');
 
    } catch (err) {
      console.error(err);
      list.innerHTML = '<p class="empty-admin">❌ Could not load. Check Firestore is enabled in Firebase console.</p>';
    }
  }
 
  // ── Admin: Clear All ─────────────────────────────────────
  async function clearAllAdmin() {
    if (!confirm('Delete ALL submissions from Firebase? This cannot be undone.')) return;
    document.getElementById('adminList').innerHTML =
      '<p class="empty-admin">Deleting<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>';
    try {
      await deleteAllFromFirebase();
      document.getElementById('adminList').innerHTML =
        '<p class="empty-admin">All cleared! 🗑</p>';
      document.getElementById('adminMeta').textContent = '0 submissions';
    } catch (e) {
      alert('Error deleting: ' + e.message);
    }
  }
 
  // ── Helpers ──────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
